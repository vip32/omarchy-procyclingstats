name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python (pinned)
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # setup-node v4
        with:
          node-version: "22"
      - name: Install Qt test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qt6-qpa-plugins qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - run: ./tests/run
        env:
          PCS_REQUIRE_QT: "1"
